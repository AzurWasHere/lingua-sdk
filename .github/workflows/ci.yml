name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.0.0", "22", "24.0.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # tsdown needs Node ^22.18 || ^24.11; build there, then test on the matrix version.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: CLI runs without ExperimentalWarning
        shell: bash
        run: |
          node packages/cli/bin/lingua.js --help 2> err.txt
          cat err.txt
          if grep -q ExperimentalWarning err.txt; then exit 1; fi

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:examples
      - run: pnpm --filter "./examples/*" exec lingua check
